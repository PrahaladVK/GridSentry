name: Bug report
description: Something in GridSentry isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the backend and frontend
        2. Select Floor 2, 24-hour horizon
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does this happen?
      options:
        - Forecasting engine / API (backend)
        - Anomaly detection
        - Data pipeline / seeding
        - Dashboard (frontend)
        - Other
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, Node version
